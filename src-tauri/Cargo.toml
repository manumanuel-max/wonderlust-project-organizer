[package]
name = "wonderlust-project-organizer"
version = "0.1.0"
description = "Wonderlust Project Organizer"
authors = ["Wonderlust"]
edition = "2021"
license = "UNLICENSED"

[workspace]
members = ["core"]

[lib]
name = "wonderlust_project_organizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wpo-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs4 = { version = "0.13", features = ["sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "unwind"

# Dependencias optimizadas también en desarrollo (hash SHA-256 y E/S más rápidos).
[profile.dev.package."*"]
opt-level = 2
