name: Pruebas y compilación

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas del núcleo (Rust)
        run: cargo test --manifest-path src-tauri/core/Cargo.toml
      - name: Pruebas y tipos del frontend
        run: |
          npm test
          npm run typecheck

  compilar:
    name: Instalador ${{ matrix.name }}
    # Se compila en paralelo con las pruebas para obtener los instaladores aunque una prueba falle;
    # revisa siempre que el trabajo "Pruebas" esté en verde antes de distribuir.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (.exe / .msi)
            os: windows-latest
            args: --bundles nsis,msi
          - name: macOS (.app / .dmg, universal)
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Linux (.deb / AppImage)
            os: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar Windows o Linux
        if: matrix.os != 'macos-latest'
        run: npx tauri build ${{ matrix.args }}
      - name: Compilar macOS
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          # Firma opcional. Sin estos secretos se generan instaladores sin firmar.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # GitHub exporta los secretos sin configurar como cadenas vacías.
          for variable in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!variable}" ]]; then
              unset "$variable"
            fi
          done
          npx tauri build ${{ matrix.args }}
      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: wonderlust-project-organizer-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
